spring.application.name=tp1-api

# Configuración con H2 para desarrollo local sin Docker (con fallback a variables de entorno si usas PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:h2:mem:backend_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Habilitar la consola web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway y JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de JWT 
jwt.secret=${JWT_SECRET:claveSecretaSuperSeguraParaDesarrolloLocalCambiarEnProduccion123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}